name: Docker Image CI

on:
  [ workflow_dispatch ]
  # push:
  #   branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up environment variables
      run: |
        echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> $GITHUB_ENV
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> $GITHUB_ENV
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> $GITHUB_ENV
        echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> $GITHUB_ENV
        echo "NODE_ENV=PROD" >> $GITHUB_ENV
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV

    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_HUB_KEY }}" | docker login -u sweekarbangera --password-stdin

    - name: Build and start services
      run: docker-compose up -d --build

    - name: Wait for Remote PostgreSQL (Render DB)
      run: |
        until pg_isready -d $DATABASE_URL; do
          echo "Waiting for PostgreSQL on Render..."
          sleep 5
        done
      env:
        PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    - name: Check running containers
      run: docker ps -a

    - name: Verify Built Images
      run: docker images
        
    # - name: Login to Docker Hub and Push the Docker Image
    #   run: |
    #     echo "${{ secrets.DOCKER_HUB_KEY }}" | docker login -u sweekarbangera --password-stdin
    #     docker push sweekarbangera/impossible_missions_force:latest
    - name: Push the Docker image
      run: docker push sweekarbangera/impossible_missions_force:latest
